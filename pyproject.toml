[project]
name = "lzf-utils"
version = "0.1.0"
description = "Audio DSP utilities"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "numpy>=1.26.4",
    "pyroomacoustics>=0.9.0",
    "scipy>=1.16.0",
    "soundfile>=0.13.0",
]

[dependency-groups]
dev = ["scipy-stubs>=1.16.3.3"]

[project.scripts]
detect_speech = "lzf_utils.audio.detect_speech:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
