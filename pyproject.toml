[project]
name = "lzf-utils"
version = "0.1.0"
description = "Audio DSP utilities"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "pyroomacoustics>=0.9.0",
    "scipy>=1.16.0",
    "scipy-stubs>=1.16.3.3",
    "soundfile>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
